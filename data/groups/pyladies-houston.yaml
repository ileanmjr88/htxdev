# THE SLUG MATTERS HERE. Three spellings answer with HTTP 200 and only one
# is canonical:
#   pyladies-houston  -> redirects to Houston_PyLadies   (this group)
#   pyladies-htx      -> redirects to Houston_PyLadies   (this group)
#   houston-pyladies  -> a DIFFERENT, empty group named just "PyLadies"
# Meetup answers 200 on a redirect, so a status check proves nothing. The
# underscore form is what X-ORIGINAL-URL reports and it resolves with no
# redirect at all, which is why it is the one in the file.
#
# pyladies.com/locations/ lists a "PyLadiesHMO" near Houston in the markup;
# that group does not exist ({"message":"Group not found"}) and is not this
# one. Checked 2026-09-18.
#
# NOT VERIFIED, and this one is worth being explicit about. It was
# verified on 2026-09-18 and unverified the same day, because verifying it
# was a mistake: Ilean had not heard of this group before that day, and
# verification is not "the feed decodes" or "the slug resolves". It is a
# person saying the group is real and the feed is legitimately theirs, and
# nobody here can say that yet.
#
# Adding a group and vouching for it are two different acts. Everything
# below about the slug still holds and is still useful; none of it is
# evidence about the group.
#
# To verify: go, or ask somebody who has. PyHou and the PyTexas meetup are
# both known quantities and either could vouch.
#
# NO DEFAULT VENUE, same reason as PyHou: its one event is the statewide
# PyTexas meetup, which happens in Discord.
#
# THAT EVENT APPEARS TWICE ON THE SITE, under this group and under PyHou,
# and that is the decision rather than a bug to fix later. Both groups
# cross-post the statewide meetup and Meetup gives each its own event id,
# so dedupe leaves them alone: the cluster key is (group, instant) and
# these are two groups.
#
# Merging them was considered and rejected. Somebody looking for Houston
# PyLadies needs to see that PyLadies is running something, not only that
# PyHou is; a listing is how a person finds their community, and
# collapsing it to one row deletes exactly the fact they came for. There
# is also no defensible winner: the event belongs to PyTexas, neither
# group is PyTexas, and both feeds are priority 10.
#
# The cost is two identical-looking rows, and that is a rendering problem
# rather than a data one. The site leads each card with the group name
# above the title so the pair reads as two communities and one talk.
sources:
  - kind: ics
    url: https://www.meetup.com/Houston_PyLadies/events/ical/
    priority: 10
    enabled: true
