# htxdev source registry — the curated list of Houston tech groups and where
# their events come from. This file is the product; the code is plumbing.
#
# Adding a group is one entry. For a Meetup group, copy the slug out of the URL
# and append /events/ical/ — that's the whole onboarding cost.
#
# VERIFICATION
#   verified_by / verified_at are deliberately blank. Filling one in is the act
#   of verification: it means a human confirmed this group is real and its feed
#   is legitimately theirs. Until then the group's events stay `pending` and do
#   not publish. Change these only in a PR — the commit author is the provenance.
#
#   This matters concretely: Houston Linux User Group's public calendar contains
#   personal appointments ("Dental", "Family visit") mixed in with real events.
#   Review a source's first sync before trusting it.
#
# PRIORITY
#   Lower wins when the same event appears in two feeds. A group's own feed
#   (10) beats a venue's listing of it (50) — the organizer is authoritative
#   about their own event.

venues:
  # Venues are mostly discovered from event data. Curate one here when its name
  # needs canonicalizing or it shows up under several spellings.

  - slug: ion
    name: Ion
    aliases:
      # Exactly how HLUG's Google Calendar writes it:
      #   LOCATION:The Ion\, Rooms 29 and 30\, 4201 Main St\, Houston\, TX 77002
      - The Ion
    address: 4201 Main St
    city: Houston
    state: TX
    zip: "77002"
    url: https://iondistrict.com
    # Ion's own feed emits ten variants of this building. Everything after a
    # dash is a room, not a venue: "Ion – Conference Room 028" → venue Ion,
    # room "Conference Room 028". Two caveats found in the fixture: the dash is
    # an en dash (U+2013) arriving HTML-escaped as &#8211;, so unescape before
    # splitting; and "Ion Plaza" has no dash at all, so splitting alone misses
    # it. Better signal where it exists: Ion's `venue` field is a
    # [room, building] array on 11 of 50 events, stating the hierarchy outright.
    #
    # Industrious and Second Draught share the address but are separate venues,
    # so match on name + address, never address alone.

  - slug: improving-houston
    name: Improving Houston
    address: 10111 Richmond Avenue, Suite 100
    city: Houston
    state: TX
    zip: "77042"
    url: https://improving.com
    # Publishes its monthly schedule only as an image, which is unusable as a
    # feed. It doesn't need to be a source: the groups that meet here (HOSS,
    # Code and Coffee) publish their own calendars, and their events resolve to
    # this venue. Treat the image as a discovery tool — read it, see who's
    # meeting here, add those groups.

  - slug: txrx-labs
    name: TXRX Labs
    address: 6501 Navigation Blvd
    city: Houston
    state: TX
    zip: "77011"
    url: https://txrxlabs.org

  # The three venues HOSS rotates through that Ion's feed never mentions.
  # Curated rather than left to discovery because a discovered venue is a name
  # and nothing else: no address, no link, nowhere to tell somebody to go.
  # Addresses below are HOSS's own, taken from the structured data on their
  # venue pages on 2026-09-17.

  - slug: bayland-community-center
    name: Bayland Community Center
    aliases:
      - Bayland
    address: 6400 Bissonnet Street
    city: Houston
    state: TX
    zip: "77074"
    url: https://cp4.harriscountytx.gov/Community-Centers/Community-Center/bayland-community-center
    # Hosts HOSS's fourth and fifth Wednesdays.

  - slug: bayland-annex
    name: Bayland Annex
    aliases:
      # HOSS's own structured data calls it just "Annex"; the heading on the
      # same page says "Bayland Annex". Both, because either could arrive.
      - Annex
    city: Houston
    state: TX
    url: https://houstonopensourcesociety.com/meetings/venues/bayland-annex/
    # A separate building in Bayland Park, not a room of the community centre,
    # which is why it gets its own entry rather than an alias on the one above.
    # HOSS publishes no street address for it and neither do we; the link goes
    # to their page, which has a map.
    #
    # It hosts none of the next five meetings, so htxdev has never seen it in
    # an event. It is here so that the first time HOSS moves a meeting to it,
    # the venue is already canonical instead of arriving as a new discovery.

  - slug: zion-lutheran-church
    name: Zion Lutheran Church
    address: 3606 Beauchamp Blvd
    city: Houston
    state: TX
    zip: "77009"
    url: https://zionhouston.org/
    # In the Heights. Hosts HOSS's second Wednesday.

groups:
  - slug: ion-district
    name: Ion District
    url: https://iondistrict.com
    category: startup
    verified_by: ileanmjr88
    verified_at: 2026-09-17
    # Verified 2026-09-17 by reading a full sync of this feed: 45 events in the
    # window, all of them public Ion District programming (pitch days, office
    # hours, tech talks, networking). Nothing personal, nothing that looked
    # like it was published by accident. This is a venue publishing its own
    # calendar, which is a much lower-risk shape than a group running its
    # calendar off a personal account, which is what went wrong with HLUG.
    # A venue, not a community — its calendar carries many groups' events.
    # Attribute each event to its `organizer` and fall back to Ion only when
    # that can't be resolved. High leverage: one source, a dozen groups.
    # Roughly a third of its events are technical; the rest is investor
    # programming, office hours and coworking days.
    sources:
      - kind: tribe
        url: https://iondistrict.com/wp-json/tribe/events/v1/events
        priority: 50
        enabled: true

  - slug: houston-linux-user-group
    name: Houston Linux User Group
    url: https://www.houstonlinux.org/
    category: dev
    verified_by:
    verified_at:
    aliases:
      # Ion writes it this way, with a curly apostrophe (U+2019)
      - "Houston Linux User’s Group"
      - "Houston Linux"
      - HLUG
    # Weekly Wednesday user meetings plus a monthly meeting at Ion — the Ion one
    # arrives from both this feed and Ion's, which is the main dedupe case.
    # The feed also carries the calendar owner's personal appointments; do not
    # publish without reviewing.
    sources:
      - kind: ics
        url: https://calendar.google.com/calendar/ical/houstonlinuxusergroup%40gmail.com/public/basic.ics
        priority: 10
        enabled: true

  - slug: houston-open-source-society
    name: Houston Open Source Society
    url: https://houstonopensourcesociety.com
    category: dev
    verified_by: ileanmjr88
    verified_at: 2026-09-17
    # Verified 2026-09-17. Five weekly meeting slots, every one of them a
    # public HOSS meeting with a venue the group publishes itself. This is a
    # group's own site describing its own schedule, which is the lowest-risk
    # shape a source comes in.
    #
    # No default venue on purpose: HOSS rotates by week and its page names the
    # venue for every slot, so a default here could only ever be wrong.
    aliases:
      - HOSS
      - "Houston OSS"
    # Meets weekly on Wednesdays. Publishes NO calendar: atom.xml is talk
    # write-ups and member bios, re-checked 2026-09-17 and still true.
    #
    # What /meetings/ does publish is five meeting cards, one per weekly slot,
    # each carrying <time datetime="2026-10-07T18:00:00-05:00">. That is
    # semantic HTML with a spec behind it and a real UTC offset, so reading it
    # is not the same act as pattern matching over prose. kind: html exists for
    # this one source and nothing else.
    #
    # What you get is a schedule, not a calendar: the next date for each slot,
    # roughly five events covering about a month, refreshed every sync. Less
    # than the other sources give and it is all there is.
    #
    # STILL ASK THEM FOR AN ICS FEED. They're an open source group with a
    # Discord; it's a small favor, and the day they ship one this source
    # becomes `kind: ics` and internal/source/hoss.go gets deleted. That is the
    # goal, not this.
    #
    # Venues rotate by week and one of them is already curated here: the Third
    # Wednesday is at "The Ion", which is the alias on the `ion` venue above.
    sources:
      - kind: html
        url: https://houstonopensourcesociety.com/meetings/
        priority: 10
        enabled: true

  - slug: houston-code-and-coffee
    name: Houston Code and Coffee
    url: https://www.meetup.com/houston-code-and-coffee/
    category: dev
    venue: improving-houston
    verified_by: ileanmjr88
    verified_at: 2026-09-17
    # Verified 2026-09-17. One scheduled meeting, Sunday 27 September, which is
    # the group's own regular event on its own Meetup.
    #
    # The feed sends no LOCATION at all, which is why the default venue is
    # here. Improving is named in the event description ("Shout out to our
    # venue host - Improving!") but only in prose, and nothing can infer that
    # safely. This is the curation the architecture asks for: knowledge a human
    # has and a feed does not.
    sources:
      - kind: ics
        url: https://www.meetup.com/houston-code-and-coffee/events/ical/
        priority: 10
        enabled: true

  - slug: code-for-houston
    name: Code for Houston
    url: https://www.meetup.com/codeforhouston/
    category: dev
    verified_by:
    verified_at:
    aliases:
      - "Ideas to Impact!"
    sources:
      - kind: ics
        url: https://www.meetup.com/codeforhouston/events/ical/
        priority: 10
        enabled: true

  - slug: code4yall
    name: Code4Y'all
    url: https://www.meetup.com/code4yall/
    category: dev
    verified_by:
    verified_at:
    # Houston metro, meets around The Woodlands; Improving and Sparksuite
    # sponsor it. Feed is currently empty — Meetup only lists scheduled events.
    sources:
      - kind: ics
        url: https://www.meetup.com/code4yall/events/ical/
        priority: 10
        enabled: true

  - slug: houston-robotics-group
    name: Houston Robotics Group
    url: https://www.meetup.com/houstonroboticsgroup/
    category: hardware
    venue: txrx-labs
    verified_by: ileanmjr88
    verified_at: 2026-09-17
    # Verified 2026-09-17. One scheduled meeting, "Houston Robotics Group
    # Meeting @TXRX" on 19 September, the group's own event on its own Meetup.
    #
    # The feed sends no LOCATION, so the venue comes from here. The event title
    # says @TXRX and the group meets there; it occasionally moves to the Ion,
    # and on those weeks Meetup will either carry a LOCATION, which wins, or it
    # will be wrong. A default that is right most weeks beats no venue at all.
    sources:
      - kind: ics
        url: https://www.meetup.com/houstonroboticsgroup/events/ical/
        priority: 10
        enabled: true

  - slug: houston-ai-meetup
    name: Houston Artificial Intelligence Meetup Group
    url: https://www.meetup.com/meetup-group-btoomzkr/
    category: data
    verified_by:
    verified_at:
    # UNCONFIRMED: found by search, not by Ilean. This may not be the Heights
    # AI group you had in mind — check before verifying. Feed currently empty.
    sources:
      - kind: ics
        url: https://www.meetup.com/meetup-group-btoomzkr/events/ical/
        priority: 10
        enabled: true

  - slug: side-project-society
    name: Side Project Society
    url: https://www.meetup.com/side-project-society/
    category: dev
    venue: improving-houston
    verified_by: ileanmjr88
    verified_at: 2026-09-17
    aliases:
      - SPS
    # Verified 2026-09-17 on a different basis from the others, and worth
    # saying so. The feed has no scheduled events today, so there was no first
    # sync to read; the calendar answers, its name is right, and Ilean knows
    # the organizer personally and attends. That is a stronger claim than
    # reading output, not a weaker one, but it is not the same claim.
    #
    # What it does not cover is what the feed will contain later. Give the
    # first sync that returns actual events a glance, the way every other
    # group here got one.
    #
    # THE MEETUP FEED MAY STAY EMPTY. Checked 2026-09-17: the group has 48
    # monthly meetings behind it and announces upcoming ones on its own site
    # and on LinkedIn Events, not on Meetup. Meetup still lists past events but
    # nothing upcoming, which is why the ICS returns zero.
    #
    # sideprojectsociety.com/events/ is the live source, and it is not usable
    # as one yet. Three reasons, all checked:
    #   - Event pages carry a date and no time:
    #       <time datetime="2026-10-01T00:00:00.000Z">
    #     Publishing that means showing midnight or inventing 18:00. The group
    #     meets Thursdays 6-8pm and Oct 1 is a Thursday, so the time is
    #     knowable, but not from anything they publish. A wrong venue sends
    #     somebody to the wrong building; a wrong time makes them miss the
    #     event, so this is not the place to guess.
    #   - The index carries no dates, so reading it is one request per event
    #     rather than the single page HOSS gets away with.
    #   - rss.xml is the unmodified Astro starter template: "First post",
    #     "Lorem ipsum", every link pointing at example.com. So does the
    #     homepage's <link rel="alternate">, and so does the og:url on each
    #     event page.
    #
    # ASK DANYAL. Two things, and Ilean knows him: his RSS feed is publishing
    # placeholder posts, which he probably does not know; and a start time on
    # the event pages, or an ICS feed, would make the group syndicatable by
    # anything, not just by htxdev. Same move as the HOSS ask, and that one
    # turned out to have good markup already.
    # Monthly-ish, Thursdays 6-8pm at Improving Houston, which is already a
    # curated venue above. Organized by Danyal Mahmud, who runs it as a Meetup
    # Pro group; 4+ years running. Confirmed 2026-09-17 by search AND by the
    # feed answering 200, which is a higher bar than houston-ai-meetup cleared.
    #
    # Category is a judgement call: the group is explicitly for side projects
    # "both technical and non-technical", so `dev` overstates it slightly.
    # Kept as dev because that is who attends and what gets demoed.
    #
    # Feed currently empty — Meetup only lists scheduled events, same as
    # code4yall and houston-robotics-group.
    sources:
      - kind: ics
        url: https://www.meetup.com/side-project-society/events/ical/
        priority: 10
        enabled: true

# Deliberately excluded — recorded so they don't get re-added later:
#
#   PyTexas — meetup.com/pytexas-virtual-meetup/ is Austin-based. No Houston
#     Python group found under the obvious Meetup slugs. Worth another look if
#     you know it under a different name.
#
#   Eventbrite (any group) — robots.txt disallows /rss/, /atom/, /events/rss/
#
#   sideprojectsociety.com as an `html` source — NOT excluded, just not ready.
#     Its event pages publish a date with no start time, and the index needs
#     one request per event. See the note on side-project-society above; the
#     first move is asking Danyal for a time or a feed, not writing a decoder
#     that has to guess one.
#     and *?calendar*. No polite automated path exists.
#
#   Discord-only groups — scheduled events require a bot token and per-server
#     membership. Unreachable. Use data/manual-events.yaml if one matters.
